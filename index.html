 document.getElementById('h1').textContent=`📚 ${D.length}일 완강 플래너`;
 document.getElementById('rg').innerHTML=ring(pc2,{bg:'rgba(255,255,255,.28)',fg:'#fff'},4)+`<b>${pc2}<small>%</small></b>`;
 const left=D.length-1-ti,t0=new Date();t0.setHours(0,0,0,0);
 document.getElementById('dd').textContent=ti<0?`시작까지 D-${-ti}`:ti>=D.length?'🎉 기간 종료':left===0?'오늘이 마지막 날!':`완강 D-${left} · ${ti+1}일차`;
 document.getElementById('sn').textContent=`수능 D-${Math.round((SUN-t0)/864e5)}`;
 const wi=(t0.getDay()+6)%7;
 document.getElementById('wk').innerHTML=['월','화','수','목','금','토','일'].map((d,i)=>{const s='mkmkmse'[i];return`<div class="${i===wi?'on':''}" style="--c:var(--${s})"><span>${d}</span><b>${IC[s]}</b><small>${N[s]}</small></div>`}).join('');
 document.getElementById('sj').innerHTML=ORD.map(s=>{const c=C[s];return`<div class="sc" style="--c:var(--${s})"><div class="t">${IC[s]} ${N[s]}</div><div class="n">${Math.round(c.d/c.t*100)}%<small>${c.d}/${c.t}강</small></div><div class="bar"><i style="width:${c.d/c.t*100}%"></i></div></div>`}).join('');
 document.getElementById('sx').innerHTML=`<div><b>${hh(dm)}</b><span>들은 강의</span></div><div><b>${hh(tm-dm)}</b><span>남은 강의</span></div><div><b>${tn?tk+'/'+tn:'-'}</b><span>오늘 체크</span></div>`;
 document.getElementById('list').innerHTML=h;
 const sd=document.getElementById('sd');if(sd.value!==st.start)sd.value=st.start;
}
const L=document.getElementById('list');
L.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;if(e.target.checked)st.c[k]=1;else delete st.c[k];save();render()});
L.addEventListener('toggle',e=>{if(isNaN(+e.target.dataset.i))return;st.open=[...L.querySelectorAll('details[open]')].map(x=>+x.dataset.i);save()},true);
document.getElementById('sd').addEventListener('change',e=>{if(e.target.value){st.start=e.target.value;st.open=null;save();render()}});
document.getElementById('go').addEventListener('click',()=>{st.open=null;render();const t=L.querySelector('.today');if(t)t.scrollIntoView({behavior:'smooth',block:'center'})});
render();
</script></body></html>
